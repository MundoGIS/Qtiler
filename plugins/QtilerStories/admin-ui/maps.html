<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qtiler Stories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/Thirdparty/bulmaswatch-spacelab.min.css" />
  <script src="/lang-support.js"></script>
  <style>
    html, body { min-height: 100%; }
    body { background: radial-gradient(circle at top, #dbeafe 0, #f8fafc 36%, #eef2ff 100%); display: flex; flex-direction: column; min-height: 100vh; font-family: "Manrope", "Segoe UI", sans-serif; color: #0f172a; }
    main.maps-main { flex: 1 0 auto; }
    .hero.is-portal { background: var(--portal-header-bg, linear-gradient(135deg, #0f766e, #2563eb 48%, #0f172a)); color: var(--portal-header-text, #fff); position: relative; overflow: hidden; background-size: cover; background-position: center; }
    .hero.is-portal::after { content: ''; position: absolute; width: 420px; height: 420px; border-radius: 999px; right: -120px; top: -120px; background: radial-gradient(circle, rgba(255,255,255,0.22), rgba(255,255,255,0)); z-index: 1; pointer-events: none; }
    .hero.is-portal .hero-body { min-height: var(--portal-header-height, 120px); display: flex; align-items: center; position: relative; z-index: 2; }
    .hero.is-portal h1 { color: var(--portal-header-text, #fff); }
    .hero.is-portal .subtitle { color: var(--portal-header-subtitle, rgba(255,255,255,0.85)); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 0.9rem; }
    .brand img { max-height: 56px; max-width: 200px; background: rgba(255,255,255,0.92); padding: 4px 8px; border-radius: 10px; box-shadow: 0 12px 30px rgba(15,23,42,0.15); }
    .brand-text h1 { margin: 0; font-family: var(--portal-header-font, "Fraunces", Georgia, serif); letter-spacing: -.02em; }
    .brand-text p { font-family: var(--portal-header-font, "Manrope", "Segoe UI", sans-serif); margin: 0; }
    .top-actions { display: flex; align-items: center; gap: 0.6rem; }
    .top-actions select { font-size: 0.85rem; }
    .auth-bar { display: flex; align-items: center; gap: 0.6rem; color: var(--portal-header-text, #fff); }
    .auth-bar .user-name { font-weight: 600; }
    .login-modal .box { max-width: 380px; margin: 0 auto; }
    .portal-nav-wrap { background: rgba(255,255,255,0.82); border-bottom: 1px solid rgba(226,232,240,0.9); backdrop-filter: blur(18px); position: sticky; top: 0; z-index: 20; }
    .portal-nav { display: flex; gap: 0.75rem; flex-wrap: wrap; padding: 0.95rem 0; }
    .portal-nav a { color: #334155; text-decoration: none; font-weight: 700; padding: 0.6rem 0.95rem; border-radius: 999px; transition: all .18s ease; }
    .portal-nav a:hover { background: #eff6ff; color: #0f172a; }
    .portal-nav a.is-active { background: #0f172a; color: #fff; box-shadow: 0 12px 26px rgba(15,23,42,0.18); }
    .map-card { height: 100%; display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s; background: #fff; }
    .map-card:hover { transform: translateY(-4px); box-shadow: 0 8px 12px rgba(0,0,0,0.15); }
    .map-card-image { height: 180px; background-size: cover; background-position: center; background-color: #eee; position: relative; }
    .map-card-image::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 50%; background: linear-gradient(transparent, rgba(0,0,0,0.6)); }
    .map-card-title { position: absolute; bottom: 10px; left: 15px; color: #fff; font-weight: bold; font-size: 1.25rem; margin: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .map-card-body { padding: 15px; flex: 1; }
    .map-card-desc { font-size: 0.9rem; color: #666; margin-bottom: 15px; }
    .map-source-badge { display: inline-block; font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 999px; background: #eff6ff; color: #2563eb; }
    .map-source-badge--hajk { background: #f0fdf4; color: #15803d; }
    .map-source-badge--3d { background: #fdf4ff; color: #a21caf; }
    .portal-page { display: grid; gap: 1.5rem; }
    .portal-page > .portal-section:first-child { margin-top: .25rem; }
    .portal-section { background: rgba(255,255,255,0.92); border-radius: 24px; box-shadow: 0 18px 40px rgba(15, 23, 42, 0.09); overflow: hidden; border: 1px solid rgba(226,232,240,0.8); }
    .portal-section__body { padding: 2rem; }
    .portal-section__eyebrow { text-transform: uppercase; letter-spacing: .08em; font-weight: 700; font-size: .76rem; color: rgba(255,255,255,.85); margin-bottom: 0.85rem; }
    .portal-section--hero { min-height: 420px; color: #fff; display: grid; align-items: end; background: linear-gradient(135deg, #0f766e, #2563eb); background-size: cover; background-position: center; position: relative; isolation: isolate; }
    .portal-section--hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,23,42,0.08), rgba(15,23,42,0.54)); z-index: -1; }
    .portal-section--hero::after { content: ''; position: absolute; inset: auto -120px -120px auto; width: 360px; height: 360px; border-radius: 999px; background: radial-gradient(circle, rgba(255,255,255,0.24), rgba(255,255,255,0)); z-index: -1; }
    .portal-section--hero .portal-section__body { padding: 2.5rem; max-width: 760px; }
    .portal-section--hero h2 { color: #fff; font-family: "Fraunces", Georgia, serif; font-size: clamp(2.4rem, 4vw, 4rem); line-height: 1.03; margin: 0 0 0.75rem; }
    .portal-section--hero p { font-size: 1.05rem; line-height: 1.7; margin: 0; color: rgba(255,255,255,0.92); }
    .portal-cta { display: inline-flex; margin-top: 1.25rem; background: #fff; color: #0f172a; border-radius: 999px; padding: 0.8rem 1.2rem; text-decoration: none; font-weight: 800; box-shadow: 0 14px 28px rgba(15,23,42,0.16); }
    .portal-section h2 { margin: 0 0 0.55rem; font-size: 1.85rem; color: #0f172a; font-family: "Fraunces", Georgia, serif; }
    .portal-section__intro { color: #475569; line-height: 1.7; margin: 0 0 1rem; }
    .portal-richtext { color: #334155; line-height: 1.75; white-space: pre-wrap; }
    .portal-richtext img { max-width: 100%; height: auto; border-radius: 8px; }
    .portal-cards, .portal-social, .portal-maps { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .portal-card, .portal-social-link, .portal-map-card { border: 1px solid #e2e8f0; border-radius: 18px; background: #fff; padding: 1rem; box-shadow: 0 12px 24px rgba(15,23,42,0.05); }
    .portal-card p, .portal-map-card p { color: #475569; }
    .portal-card__action { display: inline-flex; margin-top: .75rem; color: #2563eb; font-weight: 800; text-decoration: none; }
    .portal-card__meta, .portal-social-link__meta { display: inline-block; margin-bottom: .55rem; font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: #c2410c; font-weight: 800; }
    .portal-card__image, .portal-social-link__image { height: 146px; border-radius: 14px; margin-bottom: .9rem; background: linear-gradient(135deg, #bfdbfe, #d1fae5); background-size: cover; background-position: center; }
    .portal-social-link { display: flex; align-items: flex-start; gap: 0.9rem; text-decoration: none; color: #0f172a; }
    .portal-social-link__icon { width: 42px; height: 42px; border-radius: 999px; background: #eff6ff; color: #2563eb; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; }
    .portal-map-card__thumb { height: 180px; border-radius: 14px; background: linear-gradient(135deg, #bfdbfe, #d1fae5); background-size: cover; background-position: center; margin-bottom: .85rem; }
    .portal-map-card__action { display: inline-flex; margin-top: .75rem; color: #2563eb; font-weight: 800; text-decoration: none; }
    .portal-maps.is-featured { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
    .portal-maps.is-featured .portal-map-card:first-child { grid-row: span 2; padding: 1.15rem; }
    .portal-maps.is-featured .portal-map-card:first-child .portal-map-card__thumb { height: 260px; }
    .portal-maps.is-embed, .portal-maps.is-open { grid-template-columns: 1fr; }
    .portal-map-card__embed { aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden; background: #0f172a; margin-bottom: .85rem; }
    .portal-map-card__embed iframe { width: 100%; height: 100%; border: 0; display: block; }
    .portal-map-card--open { display: grid; gap: .65rem; align-content: start; }
    .cookie-banner { position: fixed; left: 1rem; right: 1rem; bottom: 1rem; z-index: 40; background: rgba(15,23,42,0.96); color: #fff; border-radius: 20px; padding: 1.1rem 1.25rem; box-shadow: 0 24px 48px rgba(15,23,42,0.28); display: none; }
    .cookie-banner.is-visible { display: block; }
    .cookie-banner__inner { max-width: 1080px; margin: 0 auto; display: flex; gap: 1.5rem; align-items: flex-start; flex-wrap: wrap; }
    .cookie-banner__text { flex: 1; min-width: 260px; }
    .cookie-banner__text strong { display: block; margin-bottom: .4rem; font-size: 1rem; }
    .cookie-banner__text p { margin: 0; font-size: .88rem; line-height: 1.55; color: rgba(255,255,255,0.88); }
    .cookie-banner__links { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: .6rem; font-size: .8rem; }
    .cookie-banner__links a { color: #93c5fd; text-decoration: underline; }
    .cookie-banner__actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
    .cookie-banner__actions .button { border-radius: 999px; font-weight: 700; }
    .portal-footer { background: var(--portal-footer-bg, #1f2933); color: var(--portal-footer-text, #cbd5e1); padding: 2.2rem 0 2.6rem; margin-top: auto; }
    .portal-footer a { color: var(--portal-footer-link, #93c5fd); text-decoration: none; font-weight: 700; }
    .portal-footer .container { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .loading-state { padding: 4rem 2rem; text-align: center; color: #64748b; }
    .empty-state { padding: 4rem 2rem; text-align: center; }
    .empty-state h2 { font-family: "Fraunces", Georgia, serif; color: #0f172a; }
    .empty-state p { color: #64748b; max-width: 460px; margin: 0.5rem auto 0; }
  </style>
</head>
<body>
  <!-- Header -->
  <section class="hero is-portal" id="portalHero">
    <div class="hero-body">
      <div class="container" style="width:100%">
        <div class="topbar">
          <div class="brand">
            <img id="portalLogo" src="" alt="" style="display:none" />
            <div class="brand-text">
              <h1 class="title is-3" id="portalTitle">Maps</h1>
              <p class="subtitle is-6" id="portalSubtitle"></p>
            </div>
          </div>
          <div class="top-actions">
            <div class="auth-bar" id="authBar"></div>
            <select id="langSelect" class="input" style="width:auto;padding:4px 8px;"></select>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Nav -->
  <div class="portal-nav-wrap" id="portalNavWrap" style="display:none">
    <div class="container">
      <nav class="portal-nav" id="portalNav"></nav>
    </div>
  </div>

  <!-- Main content -->
  <main class="maps-main">
    <div class="container" style="padding: 2rem 1rem 3rem">
      <div id="portalContent">
        <div class="loading-state">Loading…</div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="portal-footer" id="portalFooter" style="display:none">
    <div class="container">
      <span id="portalFooterText"></span>
      <a id="portalFooterLink" href="#" target="_blank" rel="noreferrer"></a>
    </div>
  </footer>

  <!-- GDPR cookie banner -->
  <div class="cookie-banner" id="cookieBanner">
    <div class="cookie-banner__inner">
      <div class="cookie-banner__text">
        <strong id="cookieTitle"></strong>
        <p id="cookieText"></p>
        <div class="cookie-banner__links" id="cookieLinks"></div>
      </div>
      <div class="cookie-banner__actions">
        <button class="button is-small" id="cookieReject"></button>
        <button class="button is-small is-primary" id="cookieAccept"></button>
      </div>
    </div>
  </div>

  <script src="/plugins/QtilerStories/public/portal.js"></script>
</body>
</html>
