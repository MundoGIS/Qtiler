<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
  <title>Qtiler 3D Eye</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/boxicons@latest/css/boxicons.min.css" rel="stylesheet">
  <style>
    :root {
      --hajk-ink: #0f172a;
      --hajk-muted: #475569;
      --hajk-line: #d7e2ee;
      --hajk-teal: #0f766e;
      --hajk-blue: #2563eb;
      --hajk-panel: rgba(255,255,255,.94);
    }
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { font-family: "Manrope", "Segoe UI", sans-serif; background: #0f172a; color: var(--hajk-ink); }
    #cesiumContainer { position: absolute; inset: 0; }
    .viewer-shell { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
    .top-panel {
      position: absolute; left: 12px; top: 12px; right: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      min-height: 64px; padding: 10px 16px;
      background: linear-gradient(135deg, var(--hajk-teal), var(--hajk-blue) 56%, #0f172a);
      color: #fff; border-radius: 16px;
      box-shadow: 0 16px 36px rgba(15,23,42,.28);
      pointer-events: auto;
    }
    h1 { margin: 0; font-family: "Fraunces", Georgia, serif; font-size: 1.2rem; letter-spacing: -.02em; }
    .viewer-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    #viewerLogo { width: 42px; height: 42px; object-fit: contain; border-radius: 10px; background: rgba(255,255,255,.92); padding: 4px; flex: 0 0 auto; }
    #viewerLogo[hidden] { display: none; }
    .viewer-subtitle { margin: 2px 0 0; color: rgba(255,255,255,.84); font-size: .82rem; }
    #viewerStatus { margin: 0; color: rgba(255,255,255,.9); font-size: .84rem; max-width: 42vw; }
    #viewerStatus[data-tone="error"] { color: #fecaca; }
    #moduleBar { display: none; }
    .sidebar-buttons { position: absolute; left: 16px; top: 92px; display: flex; flex-direction: column; gap: 8px; z-index: 30; pointer-events: auto; }
    .sidebar-buttons button { width: 42px; height: 42px; border: 1px solid var(--hajk-line); border-radius: 12px; background: var(--hajk-panel); color: var(--hajk-ink); display: grid; place-items: center; cursor: pointer; font-size: 20px; box-shadow: 0 10px 24px rgba(15,23,42,.12); }
    .sidebar-buttons button.active, .sidebar-buttons button:hover { background: #0f172a; color: #fff; }
    .tool-panel { position: absolute; left: 68px; top: 92px; width: 320px; max-width: calc(100vw - 84px); max-height: calc(100vh - 108px); box-sizing: border-box; overflow: auto; background: var(--hajk-panel); color: var(--hajk-ink); border: 1px solid var(--hajk-line); border-radius: 6px 16px 16px 6px; padding: 0 0 12px; pointer-events: auto; box-shadow: 0 18px 40px rgba(15,23,42,.18); }
    .tool-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px 8px; border-bottom: 1px solid var(--hajk-line); background: #eff6ff; }
    .hajk-group-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; border: 0; background: #eff6ff; color: #1d4ed8; padding: 8px 12px; font: inherit; font-weight: 800; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; cursor: pointer; }
    .hajk-layer-group.is-collapsed .hajk-group-body { display: none; }
    .hajk-layer-group.is-collapsed .hajk-group-toggle i { transform: rotate(-90deg); }
    #layerList { padding: 0 10px 8px; }
    .cesium-viewer-toolbar, .cesium-viewer-bottom, .cesium-viewer-animationContainer, .cesium-viewer-timelineContainer { display: none !important; }
    .tool-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .tool-panel h2 { margin: 0; font-size: 1rem; font-family: "Fraunces", Georgia, serif; }
    .panel-close { border: 0; background: transparent; color: var(--hajk-muted); cursor: pointer; font-size: 22px; line-height: 1; }
    .tool-popup { position: absolute; left: 68px; top: 92px; width: 250px; background: var(--hajk-panel); color: var(--hajk-ink); border: 1px solid var(--hajk-line); border-radius: 16px; padding: 12px; pointer-events: auto; box-shadow: 0 16px 36px rgba(15,23,42,.16); }
    .tool-popup[hidden] { display: none; }
    .tool-popup header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .tool-popup header button { border: 0; background: transparent; color: var(--hajk-muted); cursor: pointer; font-size: 18px; line-height: 1; }
    .tool-popup-actions { display: grid; gap: 6px; }
    .tool-popup-actions .viewer-button { display: flex; align-items: center; gap: 8px; justify-content: flex-start; }
    .saved-view-item { display: grid; grid-template-columns: minmax(0, 1fr) 36px 36px; gap: 4px; align-items: center; }
    .saved-view-item .viewer-button { min-width: 0; }
    .viewer-button.icon-only { justify-content: center; padding: 7px 0; }
    .saved-view-empty { margin: 4px 0 0; color: var(--hajk-muted); font-size: .82rem; }
    .tool-form { display: grid; gap: 8px; }
    .tool-form label { display: grid; gap: 4px; font-size: .78rem; color: var(--hajk-muted); font-weight: 600; }
    .tool-form input, .tool-form select, .tool-form textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--hajk-line); border-radius: 8px; padding: 6px 8px; font: inherit; color: var(--hajk-ink); }
    .tool-form textarea { min-height: 64px; resize: vertical; }
    .tool-form .check-row { display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .icon-picker { display: flex; gap: 8px; }
    .icon-picker button { width: 42px; height: 42px; border: 1px solid var(--hajk-line); border-radius: 10px; background: #fff; cursor: pointer; display: grid; place-items: center; padding: 0; }
    .icon-picker button.active { border-color: var(--hajk-blue); box-shadow: 0 0 0 2px rgba(37,99,235,.2); }
    .icon-picker img { width: 26px; height: 26px; }
    #simulationPanel { position: absolute; left: 68px; bottom: 16px; width: 280px; background: var(--hajk-panel); color: var(--hajk-ink); border: 1px solid var(--hajk-line); border-radius: 16px; padding: 12px; pointer-events: auto; box-shadow: 0 16px 36px rgba(15,23,42,.16); }
    #simulationPanel[hidden] { display: none; }
    .sim-row { display: grid; gap: 4px; margin: 8px 0; font-size: .8rem; color: var(--hajk-muted); }
    .sim-actions { display: flex; gap: 6px; }
    .layer-group { margin: 0 0 12px; }
    .layer-group h3 { margin: 0; padding: 7px 8px; background: #eff6ff; border-radius: 8px; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: #1d4ed8; }
    .layer-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto auto; align-items: center; gap: 8px; padding: 8px 2px; border-top: 1px solid #e2e8f0; font-size: .86rem; user-select: none; }
    .layer-row input { margin: 0; }
    .layer-row span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .legend-icon { width: 22px; height: 22px; object-fit: contain; border-radius: 3px; background: #f8fafc; }
    .warning { color: #b45309; margin: 8px 0 0; font-size: .86rem; }
    .viewer-button { background: #fff; color: var(--hajk-ink); border: 1px solid var(--hajk-line); border-radius: 10px; padding: 7px 10px; cursor: pointer; font-weight: 600; }
    .viewer-button:hover { background: #f8fafc; }
    #identifyCard { position: absolute; left: 16px; bottom: 16px; width: min(360px, calc(100vw - 32px)); max-height: 42vh; overflow: auto; background: var(--hajk-panel); color: var(--hajk-ink); border: 1px solid var(--hajk-line); border-radius: 16px; padding: 12px 14px; pointer-events: auto; box-shadow: 0 16px 36px rgba(15,23,42,.18); }
    #identifyCard[hidden] { display: none; }
    #identifyCard h3 { margin: 0 0 6px; font-size: .95rem; }
    #identifyCard pre { margin: 0; white-space: pre-wrap; font-size: .78rem; color: var(--hajk-muted); }
    body.terrain-preview-mode .top-panel,
    body.terrain-preview-mode #moduleBar,
    body.terrain-preview-mode #toolButtons,
    body.terrain-preview-mode #toolPopup,
    body.terrain-preview-mode #layerPanel,
    body.terrain-preview-mode #identifyCard { display: none !important; }
    @media (max-width: 760px) {
      .top-panel { flex-wrap: wrap; }
      #viewerStatus { max-width: none; }
      .tool-panel { left: auto; right: 8px; width: min(320px, calc(100vw - 84px)); }
      .tool-popup { left: 62px; }
      .sidebar-buttons { left: 12px; }
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div class="viewer-shell">
    <section class="top-panel">
      <div class="viewer-brand">
        <img id="viewerLogo" alt="" hidden>
        <div>
          <h1 id="viewerTitle">Qtiler 3D Eye</h1>
          <p id="viewerSubtitle" class="viewer-subtitle" hidden></p>
        </div>
      </div>
      <p id="viewerStatus">Initializing...</p>
      <p id="terrainWarning" class="warning" hidden></p>
    </section>
    <aside id="layerPanel" class="tool-panel" hidden>
      <div class="tool-panel-head">
        <h2>Layers</h2>
        <button class="panel-close" type="button" aria-label="Close" onclick="document.getElementById('layerPanel').hidden = true">x</button>
      </div>
      <div id="layerList"></div>
      <button id="saveViewBtn" class="viewer-button" type="button">Save view</button>
    </aside>
    <nav id="toolButtons" class="sidebar-buttons"></nav>
    <aside id="toolPopup" class="tool-popup" hidden></aside>
    <aside id="identifyCard" hidden>
      <div class="tool-panel-head">
        <h3 id="identifyTitle">Identify</h3>
        <button class="panel-close" type="button" aria-label="Close" onclick="document.getElementById('identifyCard').hidden = true">x</button>
      </div>
      <pre id="identifyBody"></pre>
    </aside>
    <aside id="simulationPanel" hidden>
      <div class="tool-panel-head">
        <h3>Simulation</h3>
        <button class="panel-close" type="button" aria-label="Close" id="simulationClose">x</button>
      </div>
      <label class="sim-row">Height <span id="simHeightValue">10 m</span>
        <input id="cameraHeight" type="range" min="2" max="120" step="1" value="10">
      </label>
      <label class="sim-row">Speed <span id="speedValue">0.0050</span>
        <input id="simulationSpeed" type="range" min="0.0005" max="0.03" step="0.0005" value="0.005">
      </label>
      <label class="sim-row">Pitch <span id="pitchValue">-20°</span>
        <input id="simulationPitch" type="range" min="-80" max="10" step="1" value="-20">
      </label>
      <div class="sim-actions">
        <button id="simulationPlayButton" class="viewer-button" type="button">Play</button>
        <button id="simulationResetButton" class="viewer-button" type="button">Reset</button>
      </div>
    </aside>
    <div id="moduleBar"></div>
  </div>
  <script>
    (function loadCesiumRuntime() {
      var localBase = '/plugins/Qtiler-3D-eye/cesium/';
      function showRuntimeRequired(message) {
        var status = document.getElementById('viewerStatus');
        if (status) {
          status.textContent = message || 'Error: Cesium runtime is not installed. Install Cesium from the Qtiler 3D Eye admin before opening 3D maps.';
          status.dataset.tone = 'error';
        }
      }
      function addCss(base) {
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = base + 'Widgets/widgets.css';
        document.head.appendChild(css);
      }
      function addScript(base) {
        window.CESIUM_BASE_URL = base;
        var script = document.createElement('script');
        script.src = base + 'Cesium.js';
        script.onload = function() {
          if (!window.Cesium) {
            try { script.remove(); } catch (e) {}
            showRuntimeRequired('Error: Cesium runtime loaded but did not initialize. Reinstall Cesium from the Qtiler 3D Eye admin.');
            return;
          }
          addCss(base);
          var jspdf = document.createElement('script');
          jspdf.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
          document.body.appendChild(jspdf);
          var viewer = document.createElement('script');
          viewer.src = '/plugins/Qtiler-3D-eye/view/planner-viewer.js?v=20260817-hajk-wmts';
          document.body.appendChild(viewer);
        };
        script.onerror = function() {
          try { script.remove(); } catch (e) {}
          showRuntimeRequired();
        };
        document.head.appendChild(script);
      }
      addScript(localBase);
    })();
  </script>
</body>
</html>
